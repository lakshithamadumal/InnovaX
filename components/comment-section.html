<section class="comments-section" id="comments-{{id}}" data-comments-section data-post-id="{{id}}">
  <div class="comment-input-row">
    <div class="avatar">AJ</div>
    <div class="comment-input-wrap">
      <input type="text" placeholder="Write a comment..." data-comment-input data-post-id="{{id}}" />
      <button class="comment-send-btn" type="button" data-comment-send data-post-id="{{id}}">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>
  <div class="comments-list" id="comments-list-{{id}}" data-comments-list>{{comments}}</div>
</section>
