<article class="card post-card fade-in-card" id="post-{{id}}" data-post-id="{{id}}">
	<div class="post-header">
		<div class="avatar" style="background:{{avatarColor}}">{{avatar}}</div>
		<div class="user-info">
			<a class="user-name" href="user-profile.html">{{name}}</a>
			<div class="user-role">{{role}}</div>
		</div>
		<span class="post-time">{{time}}</span>
		<button class="post-more-btn" type="button"><i class="fas fa-ellipsis-h"></i></button>
	</div>

	<a class="post-title-link" href="post-view.html">
		<div class="post-title">{{title}}</div>
	</a>
	<div class="post-desc">{{desc}}</div>
	<div class="post-tags">{{tags}}</div>
	{{media}}

	<div class="post-stats">
		<div class="likes-count">
			<div class="like-icon-small"><i class="fas fa-heart"></i></div>
			<span class="likes-num" data-like-count>{{likes}}</span>
		</div>
		<button class="comments-link" type="button" data-comment-toggle data-post-id="{{id}}">{{commentCountText}}</button>
	</div>

	<div class="post-actions">
		<button class="action-btn like-btn" type="button" data-like-btn data-post-id="{{id}}">
			<i class="fas fa-heart"></i> <span>Like</span>
		</button>
		<button class="action-btn comment-btn" type="button" data-comment-toggle data-post-id="{{id}}">
			<i class="fas fa-comment"></i> <span>Comment</span>
		</button>
		<button class="action-btn share-btn" type="button" data-share-btn>
			<i class="fas fa-share"></i> <span>Share</span>
		</button>
		<button class="action-btn save-btn" type="button" data-save-btn>
			<i class="fas fa-bookmark"></i> <span>Save</span>
		</button>
	</div>

	{{commentSection}}
</article>
