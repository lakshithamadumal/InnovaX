<section class="card create-post" data-create-post-card>
  <div class="create-post-top">
    <div class="avatar">AJ</div>
    <input type="text" class="create-post-trigger" placeholder="Share your innovation..." readonly data-open-editor />
  </div>

  <div class="section-note" data-create-role-note>Student posts are published immediately.</div>

  <div class="post-editor" data-post-editor>
    <input type="text" class="post-field" data-create-title placeholder="Innovation title" />
    <textarea data-create-desc placeholder="Describe your innovation in detail..."></textarea>

    <div class="create-grid">
      <label class="field-wrap">
        <span>Category</span>
        <select data-create-category>
          <option value="AI">AI</option>
          <option value="MachineLearning">Machine Learning</option>
          <option value="DataScience">Data Science</option>
          <option value="CyberSecurity">Cyber Security</option>
          <option value="Cloud">Cloud Computing</option>
          <option value="IoT">IoT</option>
          <option value="Robotics">Robotics</option>
          <option value="Web3">Web3</option>
          <option value="GreenTech">GreenTech</option>
          <option value="BioTech">BioTech</option>
          <option value="Design">Design</option>
          <option value="EdTech">EdTech</option>
          <option value="HealthTech">HealthTech</option>
          <option value="FinTech">FinTech</option>
          <option value="AgriTech">AgriTech</option>
          <option value="Research">Research</option>
          <option value="Startup">Startup</option>
        </select>
      </label>
      <label class="field-wrap">
        <span>Tags</span>
        <input type="text" data-create-tags placeholder="#innovation #prototype" />
      </label>
    </div>

    <div class="upload-strip">
      <button class="upload-btn image" type="button" data-upload-trigger="image"><i class="fas fa-image"></i> Image</button>
      <input type="file" class="hidden-upload" data-upload-input="image" accept="image/*" />
    </div>

    <div class="create-upload-preview" data-create-upload-preview style="display:none;">
      <img src="" alt="Selected image preview" data-create-preview-image />
      <div class="create-upload-preview-meta">
        <p class="section-note" data-create-preview-label></p>
        <button type="button" class="btn-secondary" data-remove-upload>Remove</button>
      </div>
    </div>
  </div>

  <div class="create-post-actions">
    <button class="post-submit-btn" type="button" data-publish-post><i class="fas fa-paper-plane"></i> Publish</button>
  </div>
</section>
