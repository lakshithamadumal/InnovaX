<body data-page="user-profile" data-active-nav="feed" data-profile-user-role="student" data-profile-user-id="" data-profile-user-name="" data-profile-user-university="">
  <div class="toast" id="toast"></div>
  <div data-component="navbar"></div>

  <main class="container">
    <div data-component="sidebar-left"></div>
    <section class="content-column">
      <section class="section-card" style="padding:0; overflow:hidden;">
        <div class="cover-photo" data-profile-cover></div>
        <div class="profile-hero">
          <div class="profile-avatar-lg" data-profile-avatar>
            <span data-profile-avatar-initials>IN</span>
          </div>
          <div class="profile-meta">
            <h1 data-profile-name>InnovaX Member</h1>
            <p data-profile-university></p>
            <p class="section-note" data-profile-role-meta style="margin-top:6px;"></p>
            <div class="pill-row">
              <span class="badge-chip" data-public-role-badge><i class="fas fa-user-graduate"></i> Student</span>
              <span class="badge-chip" data-profile-likes-wrap><i class="fas fa-heart"></i> <span data-profile-likes-count>0</span> Likes</span>
            </div>
          </div>
          <div class="inline-actions"></div>
        </div>
      </section>

      <section class="section-card">
        <div class="section-head"><div class="section-title">About</div></div>
        <p class="profile-summary" data-profile-bio>No bio added yet.</p>
      </section>

      <section class="section-card" data-profile-section="skills">
        <div class="section-head"><div class="section-title">Skills & Interests</div></div>
        <div class="tag-list" data-profile-skills></div>
      </section>

      <section class="section-card" data-profile-section="my-posts">
        <div class="section-head"><div class="section-title">My Posts</div></div>
        <div data-post-stream="user"></div>
      </section>

      <section class="section-card" data-expert-saved-link style="display:none;">
        <div class="section-head"><div class="section-title">Saved Posts</div></div>
        <p class="section-note">Expert profiles show saved posts only.</p>
        <div class="inline-actions" style="margin-top:12px;">
          <a class="btn-primary" href="saved-posts.html">View Saved Posts</a>
        </div>
      </section>
    </section>
    <div data-component="sidebar-right"></div>
  </main>

  <div data-component="footer"></div>
  <script src="assets/js/app.js"></script>
</body>
</html>
