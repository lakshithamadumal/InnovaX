<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InnovaX | Post View</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body data-page="post-view" data-active-nav="feed">
  <div class="toast" id="toast"></div>
  <div data-component="navbar"></div>

  <main class="container">
    <div data-component="sidebar-left"></div>
    <section class="content-column">
      <article class="section-card">
        <div class="section-head">
          <div class="section-title">Post Detail</div>
          <span class="badge-chip" data-post-time><i class="fas fa-clock"></i> Now</span>
        </div>
        <h1 class="hero-title" data-post-title>Loading post...</h1>
        <p class="hero-subtitle" data-post-desc>Please wait while we load the post details.</p>
        <div class="pill-row" data-post-tags style="margin-top:10px;">
          <span class="tag">#InnovaX</span>
        </div>
        <div class="post-media" data-post-media style="margin-top:12px; display:none;">
          <div class="post-media-inner" data-post-media-inner>
            <span style="font-size:3.5rem;" data-post-media-emoji>💡</span>
            <p data-post-media-label>Post media</p>
          </div>
        </div>
        <div class="post-actions">
          <button class="action-btn like-btn" type="button" data-like-btn data-post-id="detail-1"><i class="fas fa-heart"></i><span>Like</span></button>
          <button class="action-btn share-btn" type="button" data-share-btn><i class="fas fa-share"></i><span>Share</span></button>
          <button class="action-btn save-btn" type="button" data-save-btn><i class="fas fa-bookmark"></i><span>Save</span></button>
        </div>
      </article>

      <article class="card post-card" id="post-detail-card" data-post-id="detail-1">
        <div class="post-stats">
          <div class="likes-count">
            <div class="like-icon-small"><i class="fas fa-heart"></i></div>
            <span class="likes-num" data-like-count>0</span>
          </div>
        </div>
      </article>

      <section class="section-card expert-rating-card" data-expert-rating-wrap>
        <div class="section-head">
          <div class="section-title">Expert Rating</div>
          <span class="badge-chip"><i class="fas fa-lock"></i> Private</span>
        </div>
        <p class="section-note" data-expert-rating-note>Login as an expert to submit a rating for this post.</p>

        <form data-expert-rating-form class="expert-rating-form" style="display:none;">
          <div class="field-group">
            <label for="expert-rate-value">Rate This Post (0 to 10)</label>
            <input id="expert-rate-value" type="number" min="0" max="10" step="0.1" placeholder="e.g. 8.5" required />
          </div>
          <div class="field-group">
            <label for="expert-rate-note">Note</label>
            <textarea id="expert-rate-note" rows="4" maxlength="600" placeholder="Add a short private note about this post." required></textarea>
          </div>
          <button type="submit" class="btn-primary" data-expert-submit-btn>Submit Rating</button>
        </form>

        <article class="expert-rating-result" data-expert-rating-result style="display:none;"></article>
      </section>

      <section class="section-card">
        <div class="section-head">
          <div class="section-title">Related Posts</div>
        </div>
        <div data-post-stream="post-view-related"></div>
      </section>
    </section>
    <div data-component="sidebar-right"></div>
  </main>

  <div data-component="footer"></div>
  <script src="assets/js/app.js"></script>
</body>
</html>
