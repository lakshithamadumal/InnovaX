<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InnovaX Admin Login</title>
    <link rel="icon" type="image/png" href="https://innovax.works/assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="admin-auth-body">
  <main class="admin-auth-shell">
    <section class="admin-auth-card">
      <div class="admin-brand">
        <span class="admin-brand-icon"><i class="fas fa-shield-halved"></i></span>
        <div>
          <h1>InnovaX Admin</h1>
          <p>Secure dashboard access</p>
        </div>
      </div>

      <form id="adminLoginForm" class="admin-form">
        <label for="username">Admin Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required placeholder="Enter Email" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password" />

        <button type="submit" class="btn-primary wide-btn">Login To Dashboard</button>
      </form>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
