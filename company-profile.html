<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InnovaX | Company Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body data-page="company-profile" data-active-nav="feed">
  <div class="toast" id="toast"></div>
  <div data-component="navbar"></div>

  <main class="container">
    <div data-component="sidebar-left"></div>
    <section class="content-column">
      <section class="section-card" style="padding:0; overflow:hidden;">
        <div class="cover-photo" style="background:linear-gradient(135deg,#4e73df,#3a5bbf 62%,#1cc88a);"></div>
        <div class="profile-hero">
          <div class="profile-avatar-lg" style="background:linear-gradient(135deg,#4e73df,#3a5bbf);">LC</div>
          <div class="profile-meta">
            <h1>LumenCell Energy</h1>
            <p>Advanced clean-tech company focused on high-efficiency solar systems.</p>
            <div class="pill-row">
              <span class="badge-chip"><i class="fas fa-circle-check"></i> Verified Company</span>
              <span class="status-pill success">Hiring Innovators</span>
            </div>
          </div>
          <div class="inline-actions">
            <button class="btn-primary follow-btn" type="button" data-follow-btn data-mode="connect">Contact</button>
          </div>
        </div>
      </section>

      <section class="section-card">
        <div class="section-head"><div class="section-title">Company Info</div></div>
        <div class="data-list">
          <div class="data-item"><strong>Headquarters</strong><span>Berlin, Germany</span></div>
          <div class="data-item"><strong>Focus</strong><span>Perovskite solar commercialization</span></div>
          <div class="data-item"><strong>Open Roles</strong><span>Energy Systems, Materials, Product</span></div>
        </div>
      </section>

      <section class="section-card">
        <div class="section-head"><div class="section-title">Posted Innovations</div></div>
        <div data-post-stream="company"></div>
      </section>
    </section>
    <div data-component="sidebar-right"></div>
  </main>

  <div data-component="footer"></div>
  <script src="assets/js/app.js"></script>
</body>
</html>
