<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InnovaX | Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body data-page="messages" data-active-nav="messages">
  <div class="toast" id="toast"></div>
  <div data-component="navbar"></div>

  <main class="container">
    <div data-component="sidebar-left"></div>
    <section class="content-column" data-chat-root>
      <section class="section-card">
        <div class="section-head"><div class="section-title">Messages</div></div>
        <div class="messages-layout">
          <aside class="chat-list">
            <button class="chat-user-item active" type="button" data-chat-user="sofia" data-chat-label="Sofia Rivera">
              <div class="avatar" style="background:linear-gradient(135deg,#1cc88a,#17a673);">SR</div>
              <div class="user-info"><div class="user-name">Sofia Rivera</div><div class="user-role">AI Researcher</div></div>
            </button>
            <button class="chat-user-item" type="button" data-chat-user="marcus" data-chat-label="Marcus Kim">
              <div class="avatar" style="background:linear-gradient(135deg,#E74A3B,#c0392b);">MK</div>
              <div class="user-info"><div class="user-name">Marcus Kim</div><div class="user-role">Robotics Engineer</div></div>
            </button>
            <button class="chat-user-item" type="button" data-chat-user="layla" data-chat-label="Layla Patel">
              <div class="avatar" style="background:linear-gradient(135deg,#F6C23E,#e0a800);">LP</div>
              <div class="user-info"><div class="user-name">Layla Patel</div><div class="user-role">UX Innovator</div></div>
            </button>
          </aside>

          <section class="chat-window">
            <header class="chat-header" data-chat-title>Sofia Rivera</header>
            <div class="chat-thread" data-chat-thread></div>
            <div class="chat-input-row">
              <input type="text" placeholder="Write a message..." data-chat-input />
              <button class="btn-primary" type="button" data-chat-send>Send</button>
            </div>
          </section>
        </div>
      </section>
    </section>
    <div data-component="sidebar-right"></div>
  </main>

  <div data-component="footer"></div>
  <script src="assets/js/app.js"></script>
</body>
</html>
