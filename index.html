<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InnovaX | Feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body data-page="feed" data-active-nav="feed">
  <div class="toast" id="toast"></div>
  <div data-component="navbar"></div>

  <main class="container">
    <div data-component="sidebar-left"></div>
    <section class="feed content-column">
      <div class="card section-card sort-toolbar" data-expert-sort-wrap style="display:none;">
        <div class="section-head" style="margin-bottom:0;">
          <div class="section-title">Expert Feed Sort</div>
          <select class="post-sort-select" data-feed-sort>
            <option value="recent">Recently Added</option>
            <option value="likes">Most Liked</option>
          </select>
        </div>
      </div>
      <div data-component="create-post"></div>
      <div data-post-stream="feed"></div>
    </section>
    <div data-component="sidebar-right"></div>
  </main>

  <div data-component="footer"></div>
  <script src="assets/js/app.js"></script>
</body>
</html>
