<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InnovaX | Start</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
  <style>
    * {
      overflow: hidden;
    }
  </style>
</head>
<body data-page="landing" data-active-nav="feed">
  <div class="toast" id="toast"></div>

  <main class="auth-shell">
    <div class="landing-grid">
      <section class="hero-card">
        <div class="badge-chip"><i class="fas fa-sparkles"></i> Innovator Network</div>
        <h1 class="hero-title" style="margin-top:12px;">Build, share, and scale ideas with InnovaX.</h1>
        <p class="hero-subtitle">A modern collaboration platform where students, creators, professionals, and companies co-create impactful innovation.</p>
        <div class="inline-actions" style="margin-top:14px;">
          <a class="btn-primary" href="login.html">Sign In</a>
          <a class="btn-secondary" href="register.html">Create Account</a>
        </div>
        <div class="kpi-row" style="margin-top:14px;">
          <div class="kpi-card"><span class="value">12.4k</span><span class="label">Innovators</span></div>
          <div class="kpi-card"><span class="value">1.9k</span><span class="label">Projects</span></div>
          <div class="kpi-card"><span class="value">320</span><span class="label">Companies</span></div>
          <div class="kpi-card"><span class="value">87</span><span class="label">Universities</span></div>
        </div>
      </section>

      <div class="landing-illustration-shell" aria-label="Platform illustration">
        <img
          class="landing-illustration"
          src="assets/images/thumbnails/main-illustration.svg"
          alt="InnovaX innovation collaboration illustration"
        />
      </div>
    </div>
  </main>
  <script src="assets/js/app.js"></script>
</body>
</html>
