<body data-page="register" data-active-nav="feed">
	<div class="toast" id="toast"></div>

	<main class="auth-shell">
		<section class="auth-card">
			<h1>Create Your InnovaX Account</h1>
			<p>Select your role once, then complete the guided registration.</p>

			<div class="register-role-stage" id="registerRoleStage">
				<label class="register-role-label">Choose your role to begin:</label>
				<div class="register-role-buttons">
					<button type="button" class="register-role-btn" data-register-role="student">
						<i class="fas fa-user-graduate"></i>
						Student
					</button>
					<button type="button" class="register-role-btn" data-register-role="expert">
						<i class="fas fa-chalkboard-user"></i>
						Expert
					</button>
				</div>
			</div>

			<form class="auth-form register-wizard" id="registerWizardForm" novalidate>
				<input type="hidden" id="registerRoleInput" name="role" />
				<div class="role-locked-badge" id="registerRoleBadge">
					<i class="fas fa-lock"></i>
					<span>Role locked: <strong id="registerRoleText">Student</strong></span>
				</div>

				<div class="step-tracker" id="registerStepTracker">
					<div class="step-chip active" data-step-chip="1">Account</div>
					<div class="step-chip" data-step-chip="2">University</div>
					<div class="step-chip" data-step-chip="3">Skills</div>
				</div>

				<section class="register-step active" data-register-step="1">
					<label class="field-wrap">
						<span>Full Name</span>
						<input type="text" id="registerName" name="full_name" placeholder="Alex Johnson" required />
					</label>
					<label class="field-wrap">
						<span>Email</span>
						<input type="email" id="registerEmail" name="email" placeholder="you@example.com" required />
					</label>
					<div class="register-grid-2">
						<label class="field-wrap">
							<span>Password</span>
							<input type="password" id="registerPassword" name="password" placeholder="Create password" minlength="6" required />
						</label>
						<label class="field-wrap">
							<span>Confirm Password</span>
							<input type="password" id="registerConfirmPassword" placeholder="Re-enter password" minlength="6" required />
						</label>
					</div>
				</section>

				<section class="register-step" data-register-step="2">
					<div data-student-only="true">
						<label class="field-wrap">
							<span>Student ID</span>
							<input type="text" id="registerStudentId" name="student_id" placeholder="CS20210123" />
						</label>
						<div class="register-grid-2">
							<label class="field-wrap">
								<span>University</span>
								<div style="position:relative;">
									<input type="text" id="registerUniversitySearch" class="university-search" placeholder="Search university..." autocomplete="off" />
									<input type="hidden" id="registerUniversityId" name="university_id" />
									<div class="university-dropdown" id="registerUniversityDropdown" style="display:none;"></div>
								</div>
							</label>
							<label class="field-wrap">
								<span>Faculty</span>
								<div style="position:relative;">
									<input type="text" id="registerFacultySearch" class="faculty-search" placeholder="Search faculty..." autocomplete="off" />
									<input type="hidden" id="registerFacultyId" name="faculty_id" />
									<div class="faculty-dropdown" id="registerFacultyDropdown" style="display:none;"></div>
								</div>
							</label>
						</div>
						<label class="field-wrap">
							<span>Department</span>
							<div style="position:relative;">
								<input type="text" id="registerDepartmentSearch" class="department-search" placeholder="Search department..." autocomplete="off" />
								<input type="hidden" id="registerDepartmentId" name="department_id" />
								<div class="department-dropdown" id="registerDepartmentDropdown" style="display:none;"></div>
							</div>
						</label>
					</div>
					<div data-expert-only="true" style="display:none;">
						<label class="field-wrap">
							<span>Title (e.g., Software Engineer, Designer)</span>
							<input type="text" id="registerTitle" name="title" placeholder="Your professional title" />
						</label>
						<label class="field-wrap">
							<span>Organization</span>
							<input type="text" id="registerOrganization" name="organization" placeholder="Your organization or company" />
						</label>
					</div>
				</section>

				<section class="register-step" data-register-step="3">
					<div data-student-only="true">
						<label class="field-wrap">
							<span>Skills & Interests (max 5)</span>
							<div class="skills-input-container">
								<div class="skills-input-field">
									<input type="text" id="registerSkillsSearch" class="skills-search" placeholder="Search skill and press Add" autocomplete="off" />
									<button type="button" class="btn-secondary" id="registerSkillAddBtn" style="width:auto;">Add</button>
								</div>
								<div class="skills-dropdown" id="registerSkillsDropdown" style="display:none;"></div>
								<div class="skills-tags" id="registerSelectedSkills"></div>
								<div class="suggested-skill-wrap">
									<div class="suggested-skill-title">Suggested skills:</div>
									<div class="suggested-skill-list" id="registerSuggestedSkills"></div>
								</div>
							</div>
						</label>
					</div>
					<div data-expert-only="true" style="display:none;">
						<div class="selected-role-display" style="border-radius: 8px; background: rgba(78, 115, 223, 0.08); border: 1px solid rgba(78, 115, 223, 0.15); padding: 12px 14px; margin-bottom: 0;">
							Your expert profile is ready to be created. Click below to complete registration.
						</div>
					</div>
				</section>

				<div class="register-actions">
					<div class="inline-actions" style="margin:0;">
						<a href="login.html" class="btn-secondary">Already have an account</a>
					</div>
					<div class="inline-actions" style="margin:0; gap:8px;">
						<button type="button" class="btn-secondary" id="registerBackBtn" style="display:none;">Back</button>
						<button type="button" class="btn-primary" id="registerNextBtn">Create Account</button>
					</div>
				</div>
			</form>
		</section>
	</main>

	<script src="assets/js/app.js"></script>
</body>
</html>
