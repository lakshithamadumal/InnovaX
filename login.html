<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>InnovaX | Login - Access the Innovation Hub</title>
	<meta name="title" content="InnovaX | Login - Access the Innovation Hub">
	<meta name="description" content="Log in to InnovaX to manage your innovations, connect with industry experts, and track your project growth. Secure your future at innovax.works.">
	<meta name="keywords" content="InnovaX login, innovation platform access, student login, expert portal, tech collaboration Sri Lanka, innovax.works login">
	<meta name="robots" content="index, follow">
	<meta name="language" content="English">
	<meta name="author" content="Lakshitha Madumal">

	<meta property="og:type" content="website">
	<meta property="og:url" content="https://innovax.works/login.html"> 
	<meta property="og:title" content="InnovaX | Secure Login to Your Innovation Dashboard">
	<meta property="og:description" content="Sign in to your InnovaX account to showcase your talent, collaborate with experts, and bridge the gap to industry demand.">
	<meta property="og:image" content="https://innovax.works/assets/images/og-preview.jpg">

	<meta property="twitter:card" content="summary_large_image">
	<meta property="twitter:url" content="https://innovax.works/login.html">
	<meta property="twitter:title" content="InnovaX | Member Login">
	<meta property="twitter:description" content="Access your innovation workspace and start collaborating today on innovax.works.">
	<meta property="twitter:image" content="https://innovax.works/assets/images/og-preview.jpg">

	<link rel="icon" type="image/png" href="https://innovax.works/assets/images/favicon.png">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
	<link rel="stylesheet" href="assets/css/style.css" />
	<link rel="stylesheet" href="assets/css/layout.css" />
	<link rel="stylesheet" href="assets/css/components.css" />
	<link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body data-page="login" data-active-nav="feed">
	<div class="toast" id="toast"></div>

	<main class="auth-shell">
		<section class="auth-card auth-modern-card">
			<h1>Welcome Back</h1>
			<p>Sign in to continue exploring student innovation and expert insights.</p>

			<form class="auth-form" id="loginForm" action="index.html">
				<label class="field-wrap">
					<span>Email</span>
					<input type="email" placeholder="you@example.com" required />
				</label>
				<label class="field-wrap">
					<span>Password</span>
					<input type="password" placeholder="Enter password" required />
				</label>
				<div class="inline-actions" style="justify-content:flex-end; margin-top:-2px;">
					<button type="button" class="btn-link" id="forgotPasswordLink">Forgot password?</button>
				</div>
				<div class="inline-actions" style="justify-content:space-between;">
					<a href="register.html" class="btn-secondary">Create account</a>
					<button type="submit" class="btn-primary">Sign In</button>
				</div>
			</form>
		</section>
	</main>

	<div class="auth-dialog-overlay" id="forgotPasswordModal" style="display:none;">
		<div class="auth-dialog-card forgot-card" role="dialog" aria-modal="true" aria-label="Forgot password">
			<div class="forgot-head">
				<h2>Reset Password</h2>
				<button type="button" class="btn-icon-close" id="forgotCloseBtn" aria-label="Close">&times;</button>
			</div>
			<p class="forgot-sub">Use your account email to receive a secure verification code.</p>

			<form id="forgotStep1Form" class="forgot-step" data-step="1">
				<label class="field-wrap">
					<span>Email address</span>
					<input type="email" id="forgotEmailInput" placeholder="you@example.com" required />
				</label>
				<div class="auth-dialog-actions">
					<button type="submit" class="btn-primary">Send Code</button>
				</div>
			</form>

			<form id="forgotStep2Form" class="forgot-step" data-step="2" style="display:none;">
				<label class="field-wrap">
					<span>Verification code</span>
					<input type="text" id="forgotCodeInput" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit code" required />
				</label>
				<div class="auth-dialog-actions">
					<button type="button" class="btn-secondary" id="forgotBackToEmailBtn">Back</button>
					<button type="submit" class="btn-primary">Next</button>
				</div>
			</form>

			<form id="forgotStep3Form" class="forgot-step" data-step="3" style="display:none;">
				<label class="field-wrap">
					<span>New password</span>
					<input type="password" id="forgotNewPasswordInput" minlength="6" placeholder="Minimum 6 characters" required />
				</label>
				<label class="field-wrap">
					<span>Confirm new password</span>
					<input type="password" id="forgotConfirmPasswordInput" minlength="6" placeholder="Re-enter new password" required />
				</label>
				<div class="auth-dialog-actions">
					<button type="button" class="btn-secondary" id="forgotBackToCodeBtn">Back</button>
					<button type="submit" class="btn-primary">Reset Password</button>
				</div>
			</form>
		</div>
	</div>

	<script src="assets/js/app.js"></script>
	<style>
		.auth-shell {
			background:
				radial-gradient(circle at 8% 12%, rgba(78, 115, 223, 0.24), transparent 45%),
				radial-gradient(circle at 92% 84%, rgba(28, 200, 138, 0.2), transparent 48%),
				linear-gradient(135deg, #f4f7ff 0%, #f8fbff 52%, #f4fff9 100%);
		}
		.auth-modern-card {
			border: 1px solid rgba(78, 115, 223, 0.18);
			box-shadow: 0 24px 50px rgba(40, 60, 120, 0.12);
		}
		.btn-link {
			border: none;
			background: none;
			color: #355fc8;
			font-size: 0.82rem;
			font-weight: 600;
			cursor: pointer;
			padding: 0;
		}
		.btn-link:hover {
			color: #1f4db3;
			text-decoration: underline;
		}
		.forgot-card {
			max-width: 520px;
		}
		.forgot-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			margin-bottom: 6px;
		}
		.forgot-head h2 {
			margin: 0;
		}
		.forgot-sub {
			margin-top: 0;
			margin-bottom: 14px;
		}
		.btn-icon-close {
			border: 1px solid rgba(78, 115, 223, 0.24);
			background: #f5f8ff;
			color: #355fc8;
			width: 32px;
			height: 32px;
			border-radius: 10px;
			font-size: 1.1rem;
			line-height: 1;
			cursor: pointer;
		}
		.btn-icon-close:hover {
			background: #eaf1ff;
		}
		.forgot-step .field-wrap {
			margin-bottom: 12px;
		}

		@media (max-width: 768px) {
			.auth-shell {
				padding: 16px 12px;
			}

			.auth-modern-card {
				width: min(100%, 520px);
				padding: 16px;
			}

			.forgot-card {
				width: min(94vw, 520px);
				max-width: none;
			}

			.auth-dialog-actions {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
			}

			.auth-dialog-actions .btn-secondary,
			.auth-dialog-actions .btn-primary {
				flex: 1;
				min-width: 120px;
			}

			.inline-actions {
				width: 100%;
			}

			.inline-actions .btn-secondary,
			.inline-actions .btn-primary {
				flex: 1;
				text-align: center;
				justify-content: center;
			}
		}

		@media (max-width: 480px) {
			.auth-modern-card h1 {
				font-size: 1.05rem;
			}

			.auth-modern-card p,
			.forgot-sub {
				font-size: 0.8rem;
			}

			.btn-icon-close {
				width: 30px;
				height: 30px;
			}
		}
	</style>
</body>
</html>
