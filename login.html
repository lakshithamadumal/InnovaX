<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>InnovaX | Login</title>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
	<link rel="stylesheet" href="assets/css/style.css" />
	<link rel="stylesheet" href="assets/css/layout.css" />
	<link rel="stylesheet" href="assets/css/components.css" />
	<link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body data-page="login" data-active-nav="feed">
	<div class="toast" id="toast"></div>

	<main class="auth-shell">
		<section class="auth-card auth-modern-card">
			<h1>Welcome Back</h1>
			<p>Sign in to continue exploring student innovation and expert insights.</p>
			
			<div class="role-selector" id="roleSelector">
				<label class="role-selector-label">Select your role:</label>
				<div class="role-buttons">
					<button type="button" class="role-btn" data-role="student">
						<i class="fas fa-user-graduate"></i>
						<span>Student</span>
					</button>
					<button type="button" class="role-btn" data-role="expert">
						<i class="fas fa-chalkboard-user"></i>
						<span>Expert</span>
					</button>
				</div>
			</div>

			<form class="auth-form" id="loginForm" action="index.html" style="display:none;">
				<div class="selected-role-display">
					Role: <strong id="selectedRoleDisplay"></strong>
				</div>
				<label class="field-wrap">
					<span>Email</span>
					<input type="email" placeholder="you@example.com" required />
				</label>
				<label class="field-wrap">
					<span>Password</span>
					<input type="password" placeholder="Enter password" required />
				</label>
				<div class="inline-actions" style="justify-content:space-between;">
					<a href="register.html" class="btn-secondary">Create account</a>
					<button type="submit" class="btn-primary">Sign In</button>
				</div>
			</form>
		</section>
	</main>

	<script src="assets/js/app.js"></script>
	<script>
		// Role selection for login
		const roleButtons = document.querySelectorAll('[data-role]');
		const roleSelector = document.getElementById('roleSelector');
		const loginForm = document.getElementById('loginForm');
		const selectedRoleDisplay = document.getElementById('selectedRoleDisplay');

		roleButtons.forEach(btn => {
			btn.addEventListener('click', (e) => {
				e.preventDefault();
				const role = btn.dataset.role;
				
				// Update button states
				document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
				btn.classList.add('active');
				
				// Show form
				roleSelector.style.display = 'none';
				loginForm.style.display = 'block';
				selectedRoleDisplay.textContent = role.charAt(0).toUpperCase() + role.slice(1);
			});
		});
	</script>
	<style>
		.auth-shell {
			background:
				radial-gradient(circle at 8% 12%, rgba(78, 115, 223, 0.24), transparent 45%),
				radial-gradient(circle at 92% 84%, rgba(28, 200, 138, 0.2), transparent 48%),
				linear-gradient(135deg, #f4f7ff 0%, #f8fbff 52%, #f4fff9 100%);
		}
		.auth-modern-card {
			border: 1px solid rgba(78, 115, 223, 0.18);
			box-shadow: 0 24px 50px rgba(40, 60, 120, 0.12);
		}
		.role-selector {
			margin-bottom: 2rem;
		}
		.role-selector-label {
			display: block;
			margin-bottom: 1rem;
			font-weight: 600;
			color: var(--text);
		}
		.role-buttons {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 1rem;
		}
		.role-btn {
			padding: 1.5rem;
			border: 2px solid var(--border);
			border-radius: 8px;
			background: transparent;
			cursor: pointer;
			transition: all 0.3s ease;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.5rem;
			font-size: 1rem;
			color: var(--text);
		}
		.role-btn:hover {
			border-color: var(--primary);
			background: rgba(78, 115, 223, 0.05);
		}
		.role-btn.active {
			border-color: var(--primary);
			background: var(--primary);
			color: white;
		}
		.role-btn i {
			font-size: 1.5rem;
		}
		.selected-role-display {
			margin-bottom: 1rem;
			padding: 0.75rem;
			background: rgba(78, 115, 223, 0.1);
			border-radius: 6px;
			color: var(--text);
			font-size: 0.9rem;
		}
	</style>
</body>
</html>
