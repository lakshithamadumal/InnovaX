<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>InnovaX | Login</title>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
	<link rel="stylesheet" href="assets/css/style.css" />
	<link rel="stylesheet" href="assets/css/layout.css" />
	<link rel="stylesheet" href="assets/css/components.css" />
	<link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body data-page="login" data-active-nav="feed">
	<div class="toast" id="toast"></div>

	<main class="auth-shell">
		<section class="auth-card auth-modern-card">
			<h1>Welcome Back</h1>
			<p>Sign in to continue exploring student innovation and expert insights.</p>

			<form class="auth-form" id="loginForm" action="index.html">
				<label class="field-wrap">
					<span>Email</span>
					<input type="email" placeholder="you@example.com" required />
				</label>
				<label class="field-wrap">
					<span>Password</span>
					<input type="password" placeholder="Enter password" required />
				</label>
				<div class="inline-actions" style="justify-content:space-between;">
					<a href="register.html" class="btn-secondary">Create account</a>
					<button type="submit" class="btn-primary">Sign In</button>
				</div>
			</form>
		</section>
	</main>

	<script src="assets/js/app.js"></script>
	<style>
		.auth-shell {
			background:
				radial-gradient(circle at 8% 12%, rgba(78, 115, 223, 0.24), transparent 45%),
				radial-gradient(circle at 92% 84%, rgba(28, 200, 138, 0.2), transparent 48%),
				linear-gradient(135deg, #f4f7ff 0%, #f8fbff 52%, #f4fff9 100%);
		}
		.auth-modern-card {
			border: 1px solid rgba(78, 115, 223, 0.18);
			box-shadow: 0 24px 50px rgba(40, 60, 120, 0.12);
		}
	</style>
</body>
</html>
