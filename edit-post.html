<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InnovaX | Edit Post</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body data-page="edit-post" data-active-nav="feed">
  <div class="toast" id="toast"></div>
  <div data-component="navbar"></div>

  <main class="container">
    <div data-component="sidebar-left"></div>
    <section class="content-column">
      <section class="section-card">
        <div class="section-head">
          <div class="section-title">Edit Innovation Post</div>
          <span class="status-pill warning">Draft</span>
        </div>
        <form class="auth-form">
          <label class="field-wrap"><span>Title</span><input type="text" value="AI-Driven Circular Supply Chain for University Labs" /></label>
          <label class="field-wrap"><span>Description</span><textarea>Updated version: now includes campus rollout benchmarks and industry validation notes.</textarea></label>
          <div class="grid-2">
            <label class="field-wrap"><span>Category</span><select><option selected>AI</option><option>GreenTech</option><option>Web3</option></select></label>
            <label class="field-wrap"><span>Tags</span><input type="text" value="#AI #Sustainability #Operations" /></label>
          </div>
          <div class="inline-actions">
            <button class="btn-secondary" type="button">Save Draft</button>
            <button class="btn-primary" type="button">Update Post</button>
          </div>
        </form>
      </section>

      <section class="section-card">
        <div class="section-head"><div class="section-title">Previous Versions</div></div>
        <div class="data-list">
          <div class="data-item"><strong>Version 3</strong><span>Edited 2h ago</span></div>
          <div class="data-item"><strong>Version 2</strong><span>Edited yesterday</span></div>
          <div class="data-item"><strong>Version 1</strong><span>Published 4 days ago</span></div>
        </div>
      </section>
    </section>
    <div data-component="sidebar-right"></div>
  </main>

  <div data-component="footer"></div>
  <script src="assets/js/app.js"></script>
</body>
</html>
